spring.application.name=restaurant-ordering-system

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rest_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 'update' for first run/dev convenience; switch to 'validate' once a proper migration is
# applied manually in production so Hibernate never silently alters a live table.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
# Kept ON (Spring Boot's default): controllers and Thymeleaf templates in this app access
# lazy-loaded relationships (order.getItems(), food.getCategory(), order.getTable(), etc.)
# directly on entities returned from @Transactional service methods, both in view rendering
# and in JSON responses. Turning this off requires either an explicit fetch-join/EntityGraph
# on every query that needs a nested relation, or a full DTO-mapping layer built inside each
# transactional service method - neither of which this codebase does yet. With OSIV off,
# every one of those accesses throws LazyInitializationException the moment the transactional
# service method returns. Leaving it on is the pragmatic, correct choice for this app's shape.
spring.jpa.open-in-view=true

# Off for development hot-reload; ${THYMELEAF_CACHE:true} means it's ON by default (production-
# correct - templates parse once and are cached) unless you explicitly set THYMELEAF_CACHE=false
# while actively developing.
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

spring.mvc.hiddenmethod.filter.enabled=true

server.port=${PORT:8083}

# Compresses HTML/CSS/JS/JSON responses - meaningfully smaller payloads over the wire,
# especially noticeable on a slower/higher-latency connection between the app and browser.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,text/plain
server.compression.min-response-size=1024

# Keeps a small pool of DB connections warm so a request doesn't have to pay for a fresh
# TCP+TLS handshake to TiDB on every request - matters a lot when the database is in a
# different region, since each new connection setup costs a full network round trip.
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=20000

app.base-url=${APP_BASE_URL:http://localhost:8083}
app.owner.default-email=${OWNER_DEFAULT_EMAIL:owner@restaurant.local}
app.owner.default-password=${OWNER_DEFAULT_PASSWORD:ChangeMe123!}
app.restaurant.default-name=${RESTAURANT_NAME:My Restaurant}
# Seeds the original project's demo menu (6 categories, 17 dishes) plus CGST/SGST tax on first
# run, when no categories exist yet. Runs once - set to false to start with a blank menu instead.
app.seed-demo-menu=${SEED_DEMO_MENU:true}

logging.level.root=INFO
logging.level.com.restro=INFO
