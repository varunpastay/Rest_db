<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: assets('Owner Login')}"></head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm" style="width:100%; max-width:380px;">
        <div class="card-body p-4">
            <div class="text-center mb-3">
                <i class="bi bi-shop brand-text" style="font-size:2.4rem;"></i>
                <h1 class="h5 mt-2">Owner Login</h1>
            </div>
            <div th:if="${param.error}" class="alert alert-danger py-2 small">Invalid email or password.</div>
            <div th:if="${param.logout}" class="alert alert-success py-2 small">You have been logged out.</div>
            <form th:action="@{/owner/login}" method="post">
                <div class="mb-3">
                    <label class="form-label small">Email</label>
                    <input type="email" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-brand w-100"><i class="bi bi-box-arrow-in-right"></i> Login</button>
            </form>
        </div>
    </div>
</body>
</html>
