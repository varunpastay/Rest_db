<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: assets('My Account')}"></head>
<body>
<div th:replace="~{fragments/owner-nav :: nav('account')}"></div>

<div class="container py-4" style="max-width:480px;">
    <h1 class="h4 mb-4"><i class="bi bi-person-circle"></i> My Account</h1>

    <div class="card mb-4">
        <div class="card-body">
            <div class="small text-muted-brand">Email</div>
            <div class="fw-semibold mb-1" th:text="${owner.email}">owner@restaurant.local</div>
            <div class="small text-muted-brand">Name</div>
            <div class="fw-semibold" th:text="${owner.fullName}">Owner</div>
        </div>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <div class="card-header fw-semibold">Change Password</div>
        <div class="card-body">
            <form th:action="@{/owner/account/password}" method="post">
                <label class="form-label small">Current password</label>
                <input type="password" name="currentPassword" class="form-control mb-2" required>
                <label class="form-label small">New password</label>
                <input type="password" name="newPassword" class="form-control mb-3" required minlength="8">
                <button type="submit" class="btn btn-brand w-100"><i class="bi bi-shield-lock"></i> Update Password</button>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/assets/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/js/csrf.js}"></script>
<script th:src="@{/assets/js/dark-mode-toggle.js}"></script>
</body>
</html>
