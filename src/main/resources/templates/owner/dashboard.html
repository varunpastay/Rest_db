<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: assets('Live Orders')}"></head>
<body>
<div th:replace="~{fragments/owner-nav :: nav('dashboard')}"></div>

<div class="container-fluid px-3 px-md-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0"><i class="bi bi-lightning-charge"></i> Live Orders</h1>
        <span id="liveIndicator" class="badge bg-success"><i class="bi bi-broadcast"></i> Live</span>
    </div>

    <p id="emptyQueueMessage" class="text-muted-brand text-center py-5">
        <i class="bi bi-cup-hot" style="font-size:2rem;"></i><br>
        No active orders right now. New orders will appear here automatically.
    </p>
    <div id="ordersGrid" class="row g-3 mb-5"></div>

    <hr class="my-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0"><i class="bi bi-bell"></i> Table Requests</h2>
    </div>
    <p id="assistanceEmptyMessage" class="text-muted-brand text-center py-3">
        No open requests from tables right now.
    </p>
    <div id="assistanceGrid" class="row g-3 mb-5"></div>

    <hr class="my-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0"><i class="bi bi-receipt-cutoff"></i> Ready to Bill</h2>
    </div>
    <p id="billingEmptyMessage" class="text-muted-brand text-center py-4">
        No orders waiting on payment.
    </p>
    <div id="billingGrid" class="row g-3"></div>
</div>

<script th:inline="javascript">
    window.APP_CONTEXT_PATH = '';
    window.CURRENCY_SYMBOL = /*[[${restaurant.currencySymbol}]]*/ '$';
    window.REFRESH_INTERVAL_MS = 5000;
</script>
<script th:src="@{/assets/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/js/notification-sound.js}"></script>
<script th:src="@{/assets/js/csrf.js}"></script>
<!-- WebSocket push for instant updates - falls back to the existing 5s poll if this fails to load/connect -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/7.0.0/stomp.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script th:src="@{/assets/js/realtime.js}"></script>
<script th:src="@{/assets/js/owner-dashboard.js}"></script>
<script th:src="@{/assets/js/dark-mode-toggle.js}"></script>
</body>
</html>
